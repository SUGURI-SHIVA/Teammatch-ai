services:
  - type: web
    name: teammatch-ai
    runtime: node
    buildCommand: cd backend && npm install && npx prisma generate && npx prisma db push && cd ../frontend && npm install && npm run build
    startCommand: cd backend && npm start
    envVars:
      - key: DATABASE_URL
        value: file:./dev.db
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000
